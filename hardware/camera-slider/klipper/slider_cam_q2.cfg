# Slider de câmera na Qidi Q2: a macro de slider_cam.cfg com as posições da Q2.
#
# Instalar: copie este arquivo e slider_cam.cfg para a pasta de configuração e acrescente ao
# printer.cfg (no lugar do include de slider_cam.cfg)
#   [include slider_cam_q2.cfg]
# No app, use a impressora "Q2 0.4 nozzle (time-lapse slider)": ela chama TIMELAPSE_FOTO e tira
# do layer change G-code o time-lapse da câmera da própria Q2 (TIMELAPSE_TAKE_FRAME).
#
# O Klipper junta seções repetidas: as variáveis abaixo trocam só as da macro original.

[include slider_cam.cfg]

[gcode_macro TIMELAPSE_FOTO]
# Área X -1..275, Y -1..295, mesa 270 x 270. Atrás à direita, dentro da mesa: fora da lixeira e
# da limpeza do bico (Y > 270, X 85..112, ver MOVE_TO_TRASH) e longe do slider na frente.
variable_park_x: 260
variable_park_y: 260
# Retração do perfil da Q2 no QIDI Studio (0,8 mm a 30 mm/s).
variable_retract_speed: 30
