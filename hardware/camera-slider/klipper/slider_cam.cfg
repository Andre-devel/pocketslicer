# Slider de câmera (ESP32) para time-lapse: foto por camada com o cabeçote estacionado.
#
# Instalar: copie para a pasta de configuração da impressora e acrescente ao printer.cfg
#   [include slider_cam.cfg]
# No slicer, chame TIMELAPSE_FOTO no "time-lapse G-code" (ou no de troca de camada):
#   {if timelapse_type == 1}TIMELAPSE_FOTO MODE=SMOOTH WAIT=1500{else}TIMELAPSE_FOTO WAIT=1500{endif}
# WAIT=<ms> (opcional): tempo parado no canto para a foto; sem ele vale wait_ms abaixo.
#
# MODE=SMOOTH (time-lapse suave do OrcaSlicer, com torre de purga): o fatiador imprime a torre
# logo depois desta macro, então ela não volta ao modelo, não desce o Z nem desfaz a retração.
# A torre absorve a recuperação de pressão em vez da peça. Requer o fatiador deste app
# (native/patches/0008), que depois da macro viaja direto à torre em X/Y e só então desce.
#
# Sem root: a macro não chama o ESP32. Ela só soma 1 em "shots"; o ESP32 acompanha essa variável
# pelo websocket do Moonraker e tira a foto enquanto a macro espera wait_ms.
#
# Feito para a Creality K2 (área X -12..262, Y -3..296,5). A posição de estacionamento é a
# "posição segura" do CFS (safe_pos em box.cfg): atrás à direita, fora do caminho da lâmina.
# Outras impressoras trocam as variáveis num arquivo próprio que inclui este (slider_cam_q2.cfg).

[gcode_macro TIMELAPSE_FOTO]
description: Estaciona o cabeçote e avisa o slider de câmera para tirar a foto
variable_shots: 0
variable_park_x: 205
variable_park_y: 261
# Subida antes de ir ao canto, para o bico não arrastar na peça.
variable_z_lift: 1.0
# Retração do perfil da K2 no OrcaSlicer (0,8 mm a 40 mm/s).
variable_retract: 0.8
variable_retract_speed: 40
variable_travel_speed: 250
# Tempo parado no canto: aviso do Moonraker (~0,25 s) + passo do carrinho + estabilizar + BLE.
# O fatiador pode trocar por foto com WAIT=<ms>.
variable_wait_ms: 1500
gcode:
  {% if printer.toolhead.homed_axes != "xyz" %}
    {action_respond_info("TIMELAPSE_FOTO: eixos sem homing, foto ignorada")}
  {% else %}
    # Tudo calculado aqui vale para o início da macro, antes de qualquer movimento.
    {% set pos = printer.gcode_move.gcode_position %}
    {% set lift = [z_lift, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
    {% set can_retract = printer[printer.toolhead.extruder].can_extrude %}
    {% set wait = params.WAIT|default(wait_ms)|int %}
    SAVE_GCODE_STATE NAME=timelapse_foto
    M83
    {% if can_retract %}
      G1 E-{retract} F{retract_speed * 60}
    {% endif %}
    {% if lift > 0 %}
      G91
      G1 Z{lift} F600
    {% endif %}
    G90
    G1 X{park_x} Y{park_y} F{travel_speed * 60}
    # Só avisa com o cabeçote parado no canto.
    M400
    SET_GCODE_VARIABLE MACRO=TIMELAPSE_FOTO VARIABLE=shots VALUE={shots + 1}
    G4 P{wait}
    {% if params.MODE|default("")|upper == "SMOOTH" %}
      # A próxima coisa impressa é a torre, e o fatiador vai direto até ela (posição desconhecida
      # depois desta macro: anda em X/Y e só então acerta o Z). Fica no alto para passar por
      # cima da peça; a retração também fica para a torre.
    {% else %}
      # Volta pela altura levantada e só então desce, desfaz a retração e restaura os modos.
      G1 X{pos.x} Y{pos.y} F{travel_speed * 60}
      G1 Z{pos.z} F600
      {% if can_retract %}
        G1 E{retract} F{retract_speed * 60}
      {% endif %}
    {% endif %}
    RESTORE_GCODE_STATE NAME=timelapse_foto
  {% endif %}
