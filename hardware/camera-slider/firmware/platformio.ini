; Firmware do slider de câmera (ESP32 DevKit V1, ESP32-WROOM-32).
; Compilar: pio run   Gravar: pio run -t upload   Serial: pio device monitor

[env:esp32dev]
; Arduino core 2.0.x: a biblioteca BLE Keyboard ainda não acompanha a API BLE do core 3.x.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; Wi-Fi + Bluetooth não cabem na partição padrão de 1,2 MB; sem OTA por enquanto.
board_build.partitions = huge_app.csv
monitor_speed = 115200
; Na velocidade padrão a placa falhou na primeira leitura; 115200 funcionou.
upload_speed = 115200
; NimBLE: a pilha Bluedroid conectava mas as teclas não chegavam ao celular (2 Androids).
; WEBSOCKETS_TCP_TIMEOUT: vale para o connect e para cada leitura de mensagem. Com 5 s (padrão) a
; impressora desligada travava o loop() (página e /mover); com 500 ms, Wi-Fi lento da Q2 (pong de
; vários segundos depois de uma queda) cortava mensagens no meio e a biblioteca fechava com 1002 a
; cada reconexão, sem nunca receber as fotos. 2 s aguenta a rede ruim e trava pouco o laço.
build_flags = -D USE_NIMBLE -D WEBSOCKETS_TCP_TIMEOUT=2000
lib_deps =
    t-vk/ESP32 BLE Keyboard@0.3.2
    h2zero/NimBLE-Arduino@1.4.3
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1
    waspinator/AccelStepper@1.64
