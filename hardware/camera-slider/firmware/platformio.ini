; Firmware do slider de câmera (ESP32 DevKit V1, ESP32-WROOM-32).
; Compilar: pio run   Gravar: pio run -t upload   Serial: pio device monitor

[env:esp32dev]
; Arduino core 2.0.x: a biblioteca BLE Keyboard ainda não acompanha a API BLE do core 3.x.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; Wi-Fi + Bluetooth não cabem na partição padrão de 1,2 MB; sem OTA por enquanto.
board_build.partitions = huge_app.csv
monitor_speed = 115200
; Na velocidade padrão a placa falhou na primeira leitura; 115200 funcionou.
upload_speed = 115200
; NimBLE: a pilha Bluedroid conectava mas as teclas não chegavam ao celular (2 Androids).
build_flags = -D USE_NIMBLE
lib_deps =
    t-vk/ESP32 BLE Keyboard@0.3.2
    h2zero/NimBLE-Arduino@1.4.3
    links2004/WebSockets@2.6.1
    bblanchon/ArduinoJson@7.2.1
