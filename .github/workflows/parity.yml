# Paridade com o OrcaSlicer desktop (RNF-05) e testes do motor, num emulador x86_64.
#
# slice_cli (mesma fachada do app) fatia os casos de testdata/cases.tsv e o G-code é
# comparado camada a camada com as referências do Orca desktop (scripts/test-device.sh);
# depois rodam os testes instrumentados de SlicerEngine. As dependências nativas (≈1 h)
# ficam em cache enquanto native/deps, os patches e a versão do Orca não mudarem.
name: Paridade

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_ABI: x86_64
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.31.6

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-7]* /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: NDK e CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Patches no OrcaSlicer
        run: scripts/apply-patches.sh

      - name: Chave do cache das dependências
        id: deps-key
        run: |
          orca="$(git rev-parse HEAD:third_party/OrcaSlicer)"
          echo "key=deps-$ANDROID_ABI-ndk$NDK_VERSION-$orca-${{ hashFiles('native/deps/*.cmake', 'native/deps/CMakeLists.txt', 'native/patches/**', 'scripts/build-deps.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restaurar dependências
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: native/deps/out-android-x86_64
          key: ${{ steps.deps-key.outputs.key }}

      - name: Compilar dependências
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: scripts/build-deps.sh

      # Salva logo: o cache vale mesmo que a paridade falhe adiante.
      - name: Salvar dependências
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/deps/out-android-x86_64
          key: ${{ steps.deps-key.outputs.key }}

      - name: Compilar slice_cli
        run: scripts/build-native.sh slice_cli

      - name: Compilar testes instrumentados
        run: ./gradlew :slicer-core:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64 --no-daemon

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Paridade e testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            scripts/test-device.sh
            ./gradlew :slicer-core:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 --no-daemon

      - name: G-code e relatórios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-output
          path: |
            native/build-x86_64/test/*.gcode
            slicer-core/build/reports/androidTests/
          if-no-files-found: ignore
